name: Dotfiles CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, policy, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish jq lua5.4 shellcheck tmux zsh

      - name: Run canonical checks
        run: ./bin/dotfiles-check --full

  macos-compatibility:
    name: macOS Bash 3.2 compatibility
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation tools
        run: brew install fish jq lua zsh

      - name: Run quick checks
        run: ./bin/dotfiles-check --quick

      - name: Run macOS Zsh update regression
        run: /bin/bash tests/update-check/run.sh

      - name: Run Bash 3.2 filesystem regressions
        run: |
          /bin/bash tests/dotfiles/run.sh
          /bin/bash tests/dotfiles/agents-links.sh
          /bin/bash tests/legacy-links/run.sh

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
